[build]
  # Static site - no build command needed.
  # publish = "." means serve from the root of the "website" folder (where this file lives).
  publish = "."
  
[build.environment]
  # Node version (if needed for any future build steps)
  NODE_VERSION = "18"

# Redirect rules for clean URLs (optional)
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
